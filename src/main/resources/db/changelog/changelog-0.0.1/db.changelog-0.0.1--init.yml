databaseChangeLog:
  - changeSet:
      id: 1
      author: PRT
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

  - changeSet:
      id: 2
      author: PRT
      changes:
        - createTable:
            tableName: locations
            columns:
              - column:
                  name: location_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text

  - changeSet:
      id: 3
      author: PRT
      changes:
        - createTable:
            tableName: containers
            columns:
              - column:
                  name: container_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: location_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: locations(location_id)
                    foreignKeyName: fk_containers_locations
                    deleteCascade: true

  - changeSet:
      id: 4
      author: PRT
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: item_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: container_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: containers(container_id)
                    foreignKeyName: fk_items_containers
                    deleteCascade: true