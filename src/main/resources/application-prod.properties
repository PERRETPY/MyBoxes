#Datasource configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#AlpAuth
# Configuration Spring Security OAuth2 Client
spring.security.oauth2.client.registration.keycloak.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${OAUTH_CLIENT_SECRET}

# URL du serveur Keycloak
spring.security.oauth2.client.provider.keycloak.token-uri=${OAUTH_TOKEN_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI}

#Log level configuration
logging.level.root=${LOGGING_LEVEL_ROOT:${LOGGING_LEVEL:error}}
logging.level.fr.perretpy=${LOGGING_LEVEL_PERRETPY:${LOGGING_LEVEL:error}}
logging.level.org.springframework.boot.autoconfigure.sql=${LOGGING_LEVEL_SQL:${LOGGING_LEVEL:error}}
logging.level.org.springframework.boot.web.embedded.tomcat=${LOGGING_LEVEL_TOMCAT:${LOGGING_LEVEL:error}}
