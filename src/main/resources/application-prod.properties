#Datasource configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#AlpAuth
# Configuration Spring Security OAuth2 Client
spring.security.oauth2.client.registration.keycloak.client-id=${OAUTH_CLIENT-ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${OAUTH_CLIENT-SECRET}

# URL du serveur Keycloak
spring.security.oauth2.client.provider.keycloak.token-uri=${OAUTH_TOKEN-URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER-URI}

#Log level configuration
logging.level.root=error
logging.level.fr.perretpy=error
logging.level.org.springframework.boot.autoconfigure.sql=ERROR
logging.level.org.springframework.boot.web.embedded.tomcat=ERROR
logging.level.liquibase=ERROR
